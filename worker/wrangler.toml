name = "masteringlocal-pro-api"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "masteringlocal_production_db"
database_id = "masteringlocal-d1-prod-id"

# Production and Staging Variables
[vars]
STRIPE_PRO_MONTHLY_PRICE_ID = "price_1U8NH5CseMvXi9qpU2i9i9XV"
STRIPE_PRO_YEARLY_PRICE_ID = "price_1U8NHBCseMvXi9qpLOvF4OIu"
APP_URL = "https://masteringlocal.pro"

# Note: Secret variables (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET)
# are configured securely via `wrangler secret put` or Cloudflare Dashboard.
