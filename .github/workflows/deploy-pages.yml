name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feat/production-parity
      - refactor/stripe-webhook-step-1
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        # TEMPORARY: use npm install until package-lock.json is generated and committed.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build:client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verify AudioWorklet asset
        shell: bash
        run: |
          set -euo pipefail
          WORKLET="dist/dsp-worklet.js"
          echo "🔎 Checking ${WORKLET}..."
          test -f "$WORKLET" || { echo "::error::Missing AudioWorklet: $WORKLET"; exit 1; }
          test -s "$WORKLET" || { echo "::error::AudioWorklet is empty: $WORKLET"; exit 1; }
          if grep -qiE '<!DOCTYPE[[:space:]]+html|<html[[:space:]>]' "$WORKLET"; then
            echo "::error::AudioWorklet contains HTML instead of JavaScript: $WORKLET"
            exit 1
          fi
          echo "✅ AudioWorklet exists and does not contain an HTML SPA fallback."
          wc -c "$WORKLET"

      - name: Verify frontend output
        run: |
          test -f dist/index.html
          test -s dist/index.html

      - name: Package static hosting ZIP
        run: |
          cd dist
          zip -r ../masteringlocal-pro-static.zip .

      - name: Upload static hosting ZIP
        uses: actions/upload-artifact@v4
        with:
          name: masteringlocal-pro-static
          path: masteringlocal-pro-static.zip
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=masteringlocal-pro
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
