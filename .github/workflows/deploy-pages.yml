name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feat/production-parity
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm ci

      - name: Build production applet
        run: npm run build
