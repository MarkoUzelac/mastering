name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feat/production-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build production applet
        run: bun run build

      - name: Validate Cloudflare configuration
        id: cloudflare-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub secret CLOUDFLARE_API_TOKEN is not configured; skipping Cloudflare Pages deploy."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub secret CLOUDFLARE_ACCOUNT_ID is not configured; skipping Cloudflare Pages deploy."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub repository variable CLOUDFLARE_PAGES_PROJECT is not configured; skipping Cloudflare Pages deploy."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Report Cloudflare deployment status
        if: steps.cloudflare-config.outputs.configured != 'true'
        run: echo "Cloudflare Pages deployment skipped because required GitHub configuration is missing."