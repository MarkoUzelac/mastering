name: MasteringPro Local - Production DSP Parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/production-parity

permissions:
  contents: read

jobs:
  production-parity:
    name: JS vs C++ WASM Production Parity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Setup Emscripten 4.0.15
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15

      - name: Verify toolchain
        run: |
          node --version
          python --version
          em++ --version

      - name: Generate production JS reference
        run: node tests/production_reference.js

      - name: Build production C++ WASM parity module
        run: |
          em++ tests/production_engine.cpp \
            -O3 \
            -std=c++17 \
            -sWASM=1 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=node \
            -sEXPORTED_FUNCTIONS='["_run_production_test","_free_buffer","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='["HEAPF32"]' \
            -o tests/production_engine.js

      - name: Run production WASM
        run: node tests/run_production_wasm.js

      - name: Compare production outputs
        run: python tests/production_diff.py
