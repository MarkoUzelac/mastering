name: Autofix npm lockfile

on:
  push:
    branches:
      - refactor/stripe-webhook-step-1
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/autofix-npm.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofix-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify npm-only dependency model
        run: |
          test -f package-lock.json
          test ! -f bun.lock

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): synchronize package-lock.json'
          git push
