name: Production parity autofix

on:
  push:
    branches:
      - refactor/stripe-webhook-step-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !startsWith(github.event.head_commit.message, 'autofix:') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only

      - name: Install locked dependencies
        run: npm ci

      - name: Apply production parity patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')

          if "./src/lib/firebase-admin" not in text:
              text = text.replace(
                  "import { createServer as createViteServer } from 'vite';\n",
                  "import { createServer as createViteServer } from 'vite';\nimport { firebaseAuth, db } from './src/lib/firebase-admin';\nimport { handleStripeEvent as processStripeEvent } from './src/lib/stripe-webhook';\n",
                  1,
              )

          text = re.sub(
              r"const stripe = getStripe\(\);\n  const monthlyPriceId = .*?const priceId = isYearly \? annualPriceId : monthlyPriceId;",
              """const authHeader = req.headers.authorization;\n  if (!authHeader?.startsWith('Bearer ')) {\n    return res.status(401).json({ error: 'Authentication required' });\n  }\n\n  let firebaseUser;\n  try {\n    firebaseUser = await firebaseAuth.verifyIdToken(authHeader.slice('Bearer '.length));\n  } catch {\n    return res.status(401).json({ error: 'Invalid or expired authentication token' });\n  }\n\n  const stripe = getStripe();\n  if (!stripe) {\n    return res.status(503).json({ error: 'Stripe service unavailable' });\n  }\n\n  const monthlyPriceId = process.env.STRIPE_PRO_MONTHLY_PRICE_ID;\n  const annualPriceId = process.env.STRIPE_PRO_YEARLY_PRICE_ID || process.env.STRIPE_PRO_ANNUAL_PRICE_ID;\n  if (!monthlyPriceId || !annualPriceId) {\n    return res.status(503).json({ error: 'Stripe price configuration is incomplete' });\n  }\n  const priceId = isYearly ? annualPriceId : monthlyPriceId;""",
              text,
              count=1,
              flags=re.S,
          )

          text = text.replace(
              "        customer_email: userAccount.email,\n        client_reference_id: userAccount.id,\n        metadata: {\n          plan: canonicalPlan,\n          planId: legacyPlanId,\n          userId: userAccount.id,\n        },\n        subscription_data: {\n          metadata: {\n            plan: canonicalPlan,\n            userId: userAccount.id,\n          },\n        },\n        success_url: `${origin}/?checkout=success&session_id={CHECKOUT_SESSION_ID}`,\n        cancel_url: returnUrl || `${origin}/?checkout=cancel`,",
              "        customer_email: firebaseUser.email ?? undefined,\n        client_reference_id: firebaseUser.uid,\n        metadata: {\n          plan: canonicalPlan,\n          planId: legacyPlanId,\n          firebaseUid: firebaseUser.uid,\n        },\n        subscription_data: {\n          metadata: {\n            plan: canonicalPlan,\n            firebaseUid: firebaseUser.uid,\n          },\n        },\n        success_url: `${process.env.APP_URL}/?checkout=success&session_id={CHECKOUT_SESSION_ID}`,\n        cancel_url: `${process.env.APP_URL}/?checkout=cancel`,",
              1,
          )

          if "returnUrl" in text:
              text = text.replace("const { plan, planId, returnUrl } = req.body;", "const { plan, planId } = req.body;", 1)

          text = re.sub(
              r"app\.post\('/api/checkout/confirm', \(req, res\) => \{.*?\n\}\);",
              """app.post('/api/checkout/confirm', (_req, res) => {\n  return res.status(410).json({\n    error: 'Checkout confirmation is webhook-controlled and no longer supported.',\n  });\n});""",
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r"async function stripeWebhookHandler\(\n  req: Request,\n  res: Response\n\) \{.*?\n\}\n\nasync function handleStripeEvent\(\{.*?\n\}\n",
              """async function stripeWebhookHandler(\n  req: Request,\n  res: Response\n) {\n  const signature = req.headers['stripe-signature'];\n\n  if (!signature || Array.isArray(signature)) {\n    return res.status(400).send('Missing Stripe signature');\n  }\n\n  const stripe = getStripe();\n  const webhookSecret = process.env.STRIPE_WEBHOOK_SECRET;\n\n  if (!stripe || !webhookSecret) {\n    console.error('[Stripe Webhook] Stripe configuration unavailable');\n    return res.status(503).send('Stripe service unavailable');\n  }\n\n  let event: Stripe.Event;\n\n  try {\n    event = stripe.webhooks.constructEvent(\n      req.body,\n      signature,\n      webhookSecret\n    );\n  } catch (error) {\n    console.error('[Stripe Webhook] Invalid signature:', error);\n    return res.status(400).send('Invalid signature');\n  }\n\n  try {\n    const result = await processStripeEvent({\n      event,\n      stripe,\n      db,\n      auth: firebaseAuth,\n    });\n\n    return res.status(200).json({\n      received: true,\n      result,\n    });\n  } catch (error) {\n    console.error('[Stripe Webhook] Processing failed:', error);\n    return res.status(500).send('Internal Server Error');\n  }\n}\n\n""",
              text,
              count=1,
              flags=re.S,
          )

          if "`${process.env.APP_URL}/" in text and "process.env.APP_URL" not in text[:2000]:
              pass

          path.write_text(text, encoding='utf-8')

      - name: Fail on accidental Stripe demo fallback
        run: |
          ! grep -n "stripe_simulated" server.ts
          ! grep -n "processedWebhookEvents" server.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts package-lock.json
          if git diff --cached --quiet; then
            echo "No autofixes required"
            exit 0
          fi
          git commit -m "autofix: align production parity bootstrap"
          git push origin HEAD:refactor/stripe-webhook-step-1
